spring:
  config:
    activate:
      on-profile: dev

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3307/fc_auth_db?useUnicode=true&serverTimezone=Asia/Seoul
    username: auth
    password: auth_password
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fc.fcauth: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: debug
